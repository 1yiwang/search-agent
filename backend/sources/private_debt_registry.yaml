# European private debt / private credit intelligence — seeded search registry (Phase 2)
# Each entry: domain + site: query templates. {topic} is replaced with the research topic.

version: 1

intent_keywords:
  credit:
    - private debt
    - private credit
    - direct lending
    - corporate lending
    - leveraged loan
    - leveraged finance
    - credit fund
    - debt fund
    - mezzanine
    - unitranche
    - covenant
    - refinancing
    - dividend recap
    - fund close
    - fundraising
    - eltif
    - bdc
    - evergreen
    - distressed debt
    - special situations
    - private markets
    - allocator
    - pension fund
    - 私募债
    - 私人信贷
    - 直接贷款
  geo:
    - europe
    - european
    - eu
    - eurozone
    - luxembourg
    - switzerland
    - swiss
    - dach
    - germany
    - deutschland
    - france
    - italy
    - spain
    - nordic
    - benelux
    - uk
    - london
    - zurich
    - zürich
    - 欧洲
    - 瑞士

sources:
  - id: stepstone_insights
    domain: stepstonegroup.com
    language: en
    category: research
    tags: [credit, geo]
    search_templates:
      - "site:stepstonegroup.com {topic} private debt OR direct lending"
      - "site:stepstonegroup.com news-insights credit OR lending"

  - id: finews
    domain: finews.ch
    language: de
    category: media
    tags: [credit, geo]
    search_templates:
      - "site:finews.ch {topic} Kredit OR Private Debt OR Direct Lending"
      - "site:finews.ch Private Equity Kreditmarkt"

  - id: handelszeitung
    domain: handelszeitung.ch
    language: de
    category: media
    tags: [credit, geo]
    search_templates:
      - "site:handelszeitung.ch {topic} Private Debt OR Kreditfonds"

  - id: pei
    domain: privateequityinternational.com
    language: en
    category: media
    tags: [credit]
    search_templates:
      - "site:privateequityinternational.com {topic} private debt OR direct lending"
      - "site:privateequityinternational.com Europe private credit fundraising"

  - id: altassets
    domain: altassets.net
    language: en
    category: media
    tags: [credit]
    search_templates:
      - "site:altassets.net {topic} private debt OR credit"

  - id: eif
    domain: eif.org
    language: en
    category: institution
    tags: [credit, geo]
    search_templates:
      - "site:eif.org {topic} private debt OR venture debt OR SME finance"

  - id: eib
    domain: eib.org
    language: en
    category: institution
    tags: [credit, geo]
    search_templates:
      - "site:eib.org {topic} lending OR private debt"

  - id: bilan
    domain: bilan.ch
    language: fr
    category: media
    tags: [credit, geo]
    search_templates:
      - "site:bilan.ch {topic} dette privée OR crédit privé"
